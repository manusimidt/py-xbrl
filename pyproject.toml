[project]
name = "py-xbrl"
version = "3.0.3"
description = "Parser for parsing XBRL and iXBRL files (instance documents, taxonomy schemas, taxonomy linkbases)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "GNU General Public License v3 (GPLv3)" }
authors = [{ name = "Manuel Schmidt", email = "hello@schmidt-manuel.de" }]
urls = { Homepage = "https://github.com/manusimidt/py-xbrl" }
dependencies = [
    "requests>=2.32.3", # Used for fetching XML / XBRL / html files over HTTP(S)
    "urllib3>=2.6.3" # Used for HTTP connection retries
]
keywords = [
    "XBRL",
    "iXBRL",
    "XML",
    "Financial",
    "Accounting",
    "Taxonomy",
    "Parser",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Text Processing :: Markup :: XML",
]


[build-system]
requires = ["setuptools >=80.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xbrl*"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "prek>=0.4.13",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "twine>=7.0.0",
    "ty>=0.0.69",
]
